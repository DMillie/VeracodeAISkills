# Example: git-flow, Java/Spring Boot service built with Maven (matches samples/payments-service).
# Branching: feature/* -> develop; release/x.y cut from develop, merged to main and tagged vX.Y.Z;
# hotfix/* from main. main, develop and release/* are protected.
# Existing pipeline: build, test, package (fat jar artifact), docker-image on main and release/*.
#
# Placement (playbook/03, git-flow) as produced by the component inputs:
#   feature/* , bugfix/*  : Pipeline Scan vs the develop baseline, agent SCA, CLI directory scan
#   hotfix/*              : Pipeline Scan vs the main baseline, agent SCA, CLI directory scan
#   develop               : baseline, sandbox scan "develop", agent SCA, CLI directory scan
#   release/*             : Pipeline Scan vs develop baseline, sandbox scan per release line, agent SCA, container scan
#   main                  : baseline, agent SCA, container scan
#   tags vX.Y.Z           : policy scan named "Release vX.Y.Z" (the compliance verdict)
# Packaging (playbook/04, Java): the deployable jar the existing `package` job already builds
# (no packaging job added: package_job points at it).

stages:
  - build
  - test
  - package

default:
  image: maven:3.9-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

build:
  stage: build
  script:
    - ./mvnw -B compile

test:
  stage: test
  script:
    - ./mvnw -B test
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/

package:
  stage: package
  script:
    - ./mvnw -B package -DskipTests
  artifacts:
    expire_in: 1 month
    paths:
      - target/payments-service-*.jar

docker-image:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  needs:
    - package
  script:
    - IMAGE="${CI_REGISTRY_IMAGE:-payments-service}"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" .
    - |
      if [ -n "$CI_REGISTRY" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$IMAGE:latest"
      else
        echo "No container registry configured; image built but not pushed"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'

# ---------------------------------------------------------------------------------------------
# Veracode security scanning (added by onboarding). Integration rung 2: the organisation's
# shared component, pinned to a release and included by reference. To upgrade: change the
# version after "@". To harden the gate: change rollout_stage (audit -> warn -> block-new ->
# block-policy). Job definitions live in platform/veracode-ci, not in this repository.
# ---------------------------------------------------------------------------------------------
include:
  - component: $CI_SERVER_FQDN/platform/veracode-ci/veracode@1.3.1
    inputs:
      app_name: payments-service        # the agreed Veracode application profile (must exist)
      rollout_stage: audit              # first onboarding; move to block-new once develop and main have baselines
      sca_image: maven:3.9-eclipse-temurin-17
      stage: package
      package_job: package
      artifact: "target/payments-service-*.jar"
      baseline_branches: '^(main|develop)$'
      baseline_map: 'hotfix/*=main,*=develop'
      sandbox_branches: '^(develop|release\/.*)$'
      release_branches: '^$'
      release_tags: '^v'
      container_branches: '^(main|release\/.*)$'
