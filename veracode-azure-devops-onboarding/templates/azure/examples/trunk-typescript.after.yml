# Example: trunk, TypeScript pnpm workspace built into one image (parcel-tracker shape). Policy scan once, on main.
trigger:
  branches:
    include: ['*']

pool: Default

variables:
  IMAGE: parcel-tracker
  SHORT_SHA: $[substring(variables['Build.SourceVersion'], 0, 8)]

# Veracode: shared steps template of the security team, pinned to a release tag (change the tag to upgrade).
resources:
  repositories:
    - repository: veracode
      type: git
      name: veracode-pipelines
      ref: refs/tags/v1.0.0

stages:
  # Install, type check, tests and bundling all happen inside the image build (see Dockerfile).
  - stage: build
    jobs:
      - job: build_image
        displayName: build-image
        steps:
          - script: |
              set -e
              # the pipeline's own token reads @platform/audit-log from the Azure Artifacts feed
              docker build --secret id=npm_token,env=SYSTEM_ACCESSTOKEN -t "$IMAGE:$SHORT_SHA" .
              docker rm -f smoke 2>/dev/null || true
              docker run -d --name smoke "$IMAGE:$SHORT_SHA"
              sleep 3
              docker exec smoke wget -qO- http://127.0.0.1:8080/healthz
              docker rm -f smoke
              if [ -n "$CONTAINER_REGISTRY" ] && [ "$BUILD_SOURCEBRANCH" = "refs/heads/main" ]; then
                echo "$CONTAINER_REGISTRY_PASSWORD" | docker login -u "$CONTAINER_REGISTRY_USER" --password-stdin "$CONTAINER_REGISTRY"
                docker tag "$IMAGE:$SHORT_SHA" "$CONTAINER_REGISTRY/$IMAGE:$SHORT_SHA"
                docker tag "$IMAGE:$SHORT_SHA" "$CONTAINER_REGISTRY/$IMAGE:latest"
                docker push "$CONTAINER_REGISTRY/$IMAGE:$SHORT_SHA"
                docker push "$CONTAINER_REGISTRY/$IMAGE:latest"
              else
                echo "Image built and smoke tested; not pushed (no registry configured or not the default branch)"
              fi
            displayName: docker build, smoke test, push
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - stage: deploy
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: deploy
        environment: production
        container: debian:12-slim
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Rolling parcel-tracker $SHORT_SHA out to the depot cluster"
                    echo "helm upgrade parcel-tracker charts/parcel-tracker --set image.tag=$SHORT_SHA"
                  displayName: deploy

  # Veracode security scanning (rollout stage audit: nothing here fails the run).
  # dependsOn: [] because the package is the source itself, not a build output.
  # What it does and how to change it: veracode-steps.yml in repository veracode-pipelines.
  - stage: veracode
    displayName: veracode
    dependsOn: []
    jobs:
      - job: veracode
        variables:
          - group: veracode
        steps:
          - checkout: self
          # Veracode analyses JavaScript and TypeScript from readable source, not from the bundle the
          # image build produces. One zip for the whole workspace, so data flow through the shared
          # package is followed. Not included: tests, node_modules, dist, vendored *.min.js, workspace
          # and build-tool config (a zip of the whole repository scanned "successfully" with 0 findings).
          - bash: |
              set -euo pipefail
              out="$(Build.ArtifactStagingDirectory)/veracode"
              rm -rf "$out" && mkdir -p "$out"
              python3 - "$out/veracode-package.zip" <<'PY'
              import glob, os, sys, zipfile
              out = sys.argv[1]
              files = [f for f in ["package.json", "pnpm-lock.yaml", "tsconfig.base.json"] if os.path.isfile(f)]
              for pkg in sorted(glob.glob("packages/*/")):
                  files += [pkg + f for f in ["package.json", "tsconfig.json"] if os.path.isfile(pkg + f)]
                  for root, _, names in os.walk(pkg + "src"):
                      files += [os.path.join(root, n) for n in sorted(names) if not n.endswith(".min.js")]
              with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
                  for f in files:
                      z.write(f, f)
              print(f"veracode-package.zip: {len(files)} files, {os.path.getsize(out)} bytes")
              PY
            displayName: 'Veracode: package source'
            workingDirectory: $(Build.SourcesDirectory)
            continueOnError: true
          - template: veracode-steps.yml@veracode
            parameters:
              appProfile: parcel-tracker
